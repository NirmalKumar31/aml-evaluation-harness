# Keep the pinned action SHAs current.
#
# Pinning actions to a commit SHA is the right call -- a mutable tag means the
# workflow that passed is not the workflow that runs next. But a pin with no
# update mechanism is a pin that rots: actions here were already being
# forced off a deprecated Node runtime, with nothing to notice.
#
# Dependabot rewrites the SHA and leaves the `# vX.Y.Z` comment updated, so the
# pinning discipline survives the updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    # GROUPED, because `github/codeql-action/*` is several actions from ONE
    # repository that must move together.
    #
    # Ungrouped, Dependabot raised a separate PR per path -- `init`,
    # `analyze`, `autobuild` -- and updating one left the others behind. A
    # public PR then failed CI because the workflow mixed two versions of the
    # same action, which reads as a broken repository to anyone browsing it.
    #
    # One PR per family also means one review of one diff, rather than three
    # PRs whose individual diffs each look harmless.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      docker-actions:
        patterns:
          - "docker/*"
      actions-core:
        patterns:
          - "actions/*"

  # THE BASE IMAGE, which nothing was watching.
  #
  # The Dockerfile pins `python:3.12.14-slim-bookworm` by DIGEST, which is the
  # right call -- a patch tag is mutable and the image the tests passed on
  # would not be the image that runs the 180M-row job. The complementary
  # point is that a digest pin with no update mechanism is a pin that rots.
  # A digest pin plus Dependabot is the combination; either one alone is half
  # of it.
  - package-ecosystem: docker
    directory: "/aml-platform"
    schedule:
      interval: monthly
    commit-message:
      prefix: "image"
    # STAY ON THE SUPPORTED LINE. Unconstrained, Dependabot proposed a jump to
    # Python 3.14 -- a runtime `pyproject.toml` explicitly excludes
    # (`>=3.12,<3.13`) and the locks were never resolved against. An update PR
    # that cannot possibly be merged is worse than none: it trains the reader
    # to close dependency PRs without reading them. Patch and minor updates
    # inside 3.12 are what is wanted here.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # The runtime lock is generated by `make lock` and hashed by
  # `make lock-hashes`, so Dependabot cannot safely rewrite it on its own.
  # Alerts are still wanted; grouped monthly PRs are a prompt to regenerate,
  # not something to merge blind.
  - package-ecosystem: pip
    directory: "/aml-platform"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
