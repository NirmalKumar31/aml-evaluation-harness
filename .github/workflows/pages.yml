# Build, validate and publish the project website.
#
# ONE ARTIFACT, BUILT ONCE. The build job assembles the site, checks it, and
# uploads it. The deploy job publishes that exact artifact and never rebuilds
# -- a second build could differ from the one that passed, which is the same
# reason the image workflow promotes tested manifest bytes instead of
# rebuilding on the tag.
#
# A PULL REQUEST NEVER DEPLOYS. The build job runs on pull requests so the
# site is gated before merge; the deploy job is guarded on ref and event, and
# is the only place `pages: write` and `id-token: write` exist.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level. The deploy job widens this for itself.
permissions:
  contents: read

# One deployment at a time. Not `cancel-in-progress`: cancelling a running
# deployment can leave Pages serving a half-published state, so a superseded
# run waits rather than interrupting.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: site-build
    runs-on: ubuntu-latest
    # Longer than the other jobs: this one installs the locked Python suite
    # and the locked browser-test package, then drives three routes at five
    # widths in a real browser.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The same interpreter CI and the container pin, so the site is
          # built and tested on the version the rest of the project verifies.
          python-version: "3.12.14"

      # THE COMMITTED FILES MUST MATCH A FRESH BUILD. Both the data and the
      # HTML are generated, so either could be committed stale; without this
      # the site could render numbers from an artifact state that no longer
      # exists in the tree, which is the defect release_facts.py's
      # --verify-artifact exists to prevent one directory over.
      - name: Site data and pages are current and deterministic
        run: |
          python site/build_site_data.py --check
          python site/build_pages.py --check
          python site/build_site_data.py
          python site/build_pages.py
          git diff --exit-code -- site/data site/index.html site/explorer \
            site/engineering

      - name: Assemble the upload directory
        run: python site/assemble_site.py --dest site/_build

      # The site contracts: provenance, no superseded or withdrawn value, no
      # restricted material, relative paths, labels and alt text, and the
      # simulator's identities.
      # FROM THE HASHED LOCK, like every other job. `pip install pytest`
      # resolves whatever the index serves that morning, so the suite gating
      # a published website would be executed by an unpinned runner and a
      # pytest release could turn this red on an untouched commit.
      - name: Site contracts
        working-directory: aml-platform
        run: |
          python -m pip install -q -U pip
          python -m pip install -q --require-hashes \
            -r requirements-dev.linux-amd64.lock
          python -m pytest tests/unit/test_site.py -q

      # THE SITE IS INTERACTIVE, so a static read of the markup cannot tell
      # whether a control works. These drive the assembled artifact in the
      # browser already installed on the runner: no download at test time,
      # and an exact, locked Playwright version.
      - name: Browser tests
        working-directory: site/tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npx playwright test

      - name: Actions are pinned to a commit SHA
        run: python3 aml-platform/scripts/check_pinned_actions.py

      - name: actionlint
        run: |
          curl -fsSL -o /tmp/download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/5db9d9cde2f3deb5035dea3e45f0a9fff2f29448/scripts/download-actionlint.bash
          bash /tmp/download-actionlint.bash 1.7.4
          ./actionlint -color

      # Nothing that must not be published may reach the upload. The same
      # checker the repository uses on its own tree, pointed at the artifact.
      - name: The upload must be publishable
        run: python aml-platform/scripts/check_public_surface.py site/_build

      - name: Upload the tested site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_build

  deploy:
    # NOT FROM A PULL REQUEST, AND NOT FROM A BRANCH. A fork PR must never be
    # able to reach a deployment token, and `main` is the protected branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout and no build: this job publishes the artifact the build
      # job uploaded, and has no source tree to rebuild from by design.
      - name: Deploy the artifact build produced
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
